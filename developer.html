<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Control Panel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0b0f1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0b0f1a 100%);
        }
        .panel {
            background: rgba(20, 25, 40, 0.8);
            padding: 3rem 4rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
            text-align: center;
            backdrop-filter: blur(20px);
        }
        h1 { 
            margin-top: 0; 
            font-weight: 800;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #fff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #8892b0;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        
        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 100px;
            height: 50px;
            margin: 1.5rem 0 2.5rem 0;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2a2f4c;
            transition: .4s;
            border-radius: 50px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 40px;
            width: 40px;
            left: 5px;
            bottom: 5px;
            background-color: #fff;
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        input:checked + .slider {
            background-color: #ff0055;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2), 0 0 20px rgba(255, 0, 85, 0.4);
        }
        input:checked + .slider:before {
            transform: translateX(50px);
        }
        
        .status {
            font-size: 1.5rem;
            font-weight: 600;
            color: #00eeff;
            text-shadow: 0 0 15px rgba(0, 238, 255, 0.3);
            transition: all 0.3s ease;
        }
        .status.crashed { 
            color: #ff0055; 
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Developer Controls</h1>
        <p>Presenter Kill Switch (Affects ALL Presenter Screens)</p>
        <label class="switch">
            <input type="checkbox" id="crashToggle">
            <span class="slider"></span>
        </label>
        <div class="status" id="statusText">Connecting...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBd_8BSq9RnIQNMJCEI9QUr2OOvjcuUe-Y",
          authDomain: "bfgc-carecell.firebaseapp.com",
          projectId: "bfgc-carecell",
          storageBucket: "bfgc-carecell.firebasestorage.app",
          messagingSenderId: "367487491092",
          appId: "1:367487491092:web:754ecadcaa6527c6995b01"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const toggle = document.getElementById('crashToggle');
        const statusText = document.getElementById('statusText');
        const docRef = doc(db, "config", "status");

        // Listen to current state from Firebase
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const isCrashed = docSnap.data().is_crashed;
                toggle.checked = isCrashed;
                if (isCrashed) {
                    statusText.textContent = "Presenter is CRASHED";
                    statusText.classList.add('crashed');
                } else {
                    statusText.textContent = "Presenter is Online";
                    statusText.classList.remove('crashed');
                }
            } else {
                statusText.textContent = "Presenter is Online";
            }
        });

        toggle.addEventListener('change', async (e) => {
            const isCrashed = e.target.checked;
            statusText.textContent = "Updating...";
            await setDoc(docRef, { is_crashed: isCrashed }, { merge: true });
        });
    </script>
</body>
</html>
