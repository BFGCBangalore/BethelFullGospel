<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Presenter — Bethel Full Gospel Church</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600&display=swap');

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000000;
            --text: #ffffff;
            --muted: rgba(255,255,255,0.4);
            --highlight: #6c5cff;
            --transition-speed: 0.5s;
            --canvas-w: 1920;
            --canvas-h: 1080;
            --text-shadow-strong: 0 2px 20px rgba(0,0,0,0.5), 0 0 60px rgba(108,92,255,0.08);
            --text-shadow-weak: 0 2px 16px rgba(0,0,0,0.4);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            cursor: none;
        }

        body.controls-visible {
            cursor: default;
        }

        /* ── Canvas Wrapper — centers the scaled slide ── */
        .canvas-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 1;
        }

        /* ── Fixed 1920×1080 Slide Canvas ── */
        .slide-canvas {
            width: 1920px;
            height: 1080px;
            position: relative;
            transform-origin: center center;
            /* scale set by JS */
            background: var(--bg);
            overflow: hidden;
            flex-shrink: 0;
        }

        /* ── Subtle animated gradient background inside canvas ── */
        .bg-gradient {
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% 45%, rgba(108,92,255,0.06) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 20% 80%, rgba(108,92,255,0.03) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 80% 20%, rgba(108,92,255,0.03) 0%, transparent 60%);
            animation: bgPulse 12s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        /* ── Church logo watermark ── */
        .watermark-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            width: 280px;
            height: 280px;
            opacity: 0.04;
            pointer-events: none;
            filter: grayscale(100%) brightness(2);
            transition: opacity 1s ease;
        }

        .watermark-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ── Church name watermark ── */
        .watermark-name {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            font-family: 'Fraunces', serif;
            font-size: 18px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.06);
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 1s ease;
        }

        /* ── Main content area inside canvas ── */
        .presenter-container {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 80px;
        }

        /* ── Slide label (Verse 1, Chorus, etc.) ── */
        .slide-label {
            font-family: 'Fraunces', serif;
            font-size: 42px;
            font-weight: 500;
            color: var(--highlight);
            margin-bottom: 16px;
            letter-spacing: 0.04em;
            text-transform: capitalize;
            opacity: 0;
            transform: translateY(-12px);
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
        }

        .slide-label.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .lyrics-block {
            line-height: 1.55;
            max-width: 100%;
            margin: 0 auto;
            white-space: pre-wrap;
            word-break: break-word;
            opacity: 0;
            transform: translateY(18px);
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
        }

        .lyrics-block.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .lyrics-en {
            font-size: 64px;
            font-weight: 600;
            color: var(--text);
            text-shadow: var(--text-shadow-strong);
            margin-bottom: 14px;
        }

        .lyrics-kn,
        .lyrics-hi {
            font-size: 56px;
            font-weight: 500;
            color: rgba(255,255,255,0.78);
            text-shadow: var(--text-shadow-weak);
            margin-bottom: 12px;
        }

        .lyrics-divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--highlight), transparent);
            margin: 12px auto 20px;
            border-radius: 2px;
            opacity: 0.5;
        }

        /* ── Waiting / idle state ── */
        .waiting-message {
            font-family: 'Fraunces', serif;
            font-size: 36px;
            color: var(--muted);
            text-align: center;
            letter-spacing: 0.04em;
            opacity: 0;
            transform: scale(0.97);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .waiting-message.visible {
            opacity: 1;
            transform: scale(1);
        }

        .waiting-message .dot-pulse {
            display: inline-block;
            animation: dotPulse 1.8s ease-in-out infinite;
        }

        .waiting-message .dot-pulse:nth-child(2) { animation-delay: 0.2s; }
        .waiting-message .dot-pulse:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.2; }
            40% { opacity: 1; }
        }

        /* ── Blank screen overlay ── */
        .blank-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--bg);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        .blank-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* ── Controls bar (hover) ── */
        .controls-bar {
            display: none !important;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }

        .controls-bar.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .ctrl-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .ctrl-btn:hover {
            background: rgba(108,92,255,0.25);
            color: #fff;
            transform: scale(1.08);
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        .ctrl-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .ctrl-divider {
            width: 1px;
            height: 28px;
            background: rgba(255,255,255,0.12);
            margin: 0 4px;
        }

        .ctrl-hint {
            font-size: 0.7em;
            color: rgba(255,255,255,0.3);
            margin-left: 12px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.05em;
        }

        /* ── Song title in top-left (hover) ── */
        .song-title-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 200;
            padding: 20px 32px;
            background: linear-gradient(rgba(0,0,0,0.6), transparent);
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }

        .song-title-bar.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .song-title-text {
            font-family: 'Fraunces', serif;
            font-size: 1.15em;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            letter-spacing: 0.02em;
        }

        /* ── Keyboard shortcut toast ── */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            z-index: 300;
            padding: 16px 32px;
            background: rgba(108,92,255,0.2);
            border: 1px solid rgba(108,92,255,0.3);
            border-radius: 14px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 1.2em;
            font-weight: 500;
            letter-spacing: 0.03em;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    
/* DroidCam Overlay Styles for Presenter */
.droidcam-overlay {
  position: absolute;
  z-index: 10000;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  border: 3px solid rgba(255,255,255,0.2);
  transition: border-radius 0.3s ease;
  user-select: none;
}
.droidcam-overlay.circle {
  border-radius: 50%;
}
.droidcam-overlay.square {
  border-radius: 20px;
}
.droidcam-overlay.rect {
  border-radius: 12px;
}
.droidcam-overlay.full {
  border-radius: 0;
  border: none;
  width: 100% !important;
  height: 100% !important;
  top: 0 !important;
  left: 0 !important;
  bottom: auto !important;
  right: auto !important;
  box-shadow: none;
}
.droidcam-overlay.full .droidcam-resize-handle {
  display: none !important;
}
.droidcam-overlay:active {
  cursor: grabbing;
  border-color: rgba(255,255,255,0.5);
}
.droidcam-overlay video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}
.droidcam-resize-handle {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 30px;
  height: 30px;
  cursor: nwse-resize;
  z-index: 10001;
  background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.3) 50%);
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: auto;
}
.droidcam-overlay:hover .droidcam-resize-handle {
  opacity: 1;
}
.droidcam-resize-handle::after {
  content: '';
  position: absolute;
  bottom: 6px;
  right: 6px;
  width: 8px;
  height: 8px;
  border-right: 2px solid white;
  border-bottom: 2px solid white;
}
</style>
</head>
<body>
    <!-- Blank screen overlay -->
    <div class="blank-overlay" id="blankOverlay"></div>

    <!-- Song title bar (appears on hover) -->
    <div class="song-title-bar" id="songTitleBar">
        <div class="song-title-text" id="songTitleText"></div>
    </div>

    <!-- Canvas Wrapper — centers the scaled slide -->
    <div class="canvas-wrapper" id="canvasWrapper">
        <!-- Fixed 1920×1080 Slide Canvas -->
        <div class="slide-canvas" id="slideCanvas">
            <!-- Background gradient -->
            <div class="bg-gradient"></div>

            <!-- Church logo watermark -->
            <div class="watermark-logo">
                <img src="../logo.png" alt="" aria-hidden="true">
            </div>

            <!-- Church name watermark -->
            <div class="watermark-name">Bethel Full Gospel Church</div>

            <!-- Main content -->
            <div class="presenter-container" id="presenterContainer">
                <!-- Slide label -->
                <div class="slide-label" id="slideLabel"></div>

                <!-- Lyrics content -->
                <div id="lyricsContent"></div>

                <!-- Waiting message -->
                <div class="waiting-message" id="waitingMessage">
                    Waiting for song selection<span class="dot-pulse">.</span><span class="dot-pulse">.</span><span class="dot-pulse">.</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Controls bar -->
    <div class="controls-bar" id="controlsBar">
        <button class="ctrl-btn" id="btnPrev" title="Previous slide (←)">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button class="ctrl-btn" id="btnNext" title="Next slide (→ / Space)">
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
        </button>
        <div class="ctrl-divider"></div>
        <button class="ctrl-btn" id="btnBlank" title="Blank screen (B)">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </button>
        <button class="ctrl-btn" id="btnFullscreen" title="Fullscreen (F)">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
        <span class="ctrl-hint">← → Space &nbsp;|&nbsp; F fullscreen &nbsp;|&nbsp; B blank</span>
    </div>


    <script>
        /* ══════════════════════════════════════════
           Song Presenter — Bethel Full Gospel Church
           Fixed 1920×1080 canvas with CSS transform scaling
           ══════════════════════════════════════════ */

        const CANVAS_W = 1920;
        const CANVAS_H = 1080;
        const STORAGE_KEY = 'song_presenter_state';
        const CONTROLS_TIMEOUT = 2000;

        // DOM refs
        const slideCanvas = document.getElementById('slideCanvas');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const slideLabel = document.getElementById('slideLabel');
        const lyricsContent = document.getElementById('lyricsContent');
        const waitingMessage = document.getElementById('waitingMessage');
        const blankOverlay = document.getElementById('blankOverlay');
        const controlsBar = document.getElementById('controlsBar');
        const songTitleBar = document.getElementById('songTitleBar');
        const songTitleText = document.getElementById('songTitleText');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnBlank = document.getElementById('btnBlank');
        const btnFullscreen = document.getElementById('btnFullscreen');

        let controlsTimer = null;
        let isBlank = false;

        /* ── Scale canvas to fit window ── */
        function scaleCanvas() {
            const wrapW = window.innerWidth;
            const wrapH = window.innerHeight;
            const scale = Math.min(wrapW / CANVAS_W, wrapH / CANVAS_H);
            slideCanvas.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', scaleCanvas);
        window.addEventListener('load', scaleCanvas);
        scaleCanvas();

        /* ── Controls visibility ── */
        function showControls() {
            controlsBar.classList.add('visible');
            songTitleBar.classList.add('visible');
            document.body.classList.add('controls-visible');
            clearTimeout(controlsTimer);
            controlsTimer = setTimeout(hideControls, CONTROLS_TIMEOUT);
        }

        function hideControls() {
            controlsBar.classList.remove('visible');
            songTitleBar.classList.remove('visible');
            document.body.classList.remove('controls-visible');
        }

        document.addEventListener('mousemove', showControls);
        document.addEventListener('mousedown', showControls);

        /* ── Fullscreen ── */
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', scaleCanvas);

        /* ── Blank screen ── */
        function toggleBlank() {
            isBlank = !isBlank;
            blankOverlay.classList.toggle('active', isBlank);
        }

        /* ── Convert \n to <br> ── */
        function nl2br(str) {
            if (!str) return '';
            return str.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
        }

        /* ── Render lyrics ── */
        function renderPresenter(state) {

            if (!state) {
                // No data — show waiting
                slideLabel.classList.remove('visible');
                slideLabel.textContent = '';

                // Fade out lyrics
                const blocks = lyricsContent.querySelectorAll('.lyrics-block');
                blocks.forEach(b => b.classList.remove('visible'));

                setTimeout(() => {
                    lyricsContent.innerHTML = '';
                    waitingMessage.classList.add('visible');
                }, blocks.length ? 400 : 0);

                songTitleText.textContent = '';
                return;
            }

            waitingMessage.classList.remove('visible');

            // Apply Quick Presenter Theme (White background, Black text)
            if (state.isQuickPresenter) {
                document.documentElement.style.setProperty('--bg', '#ffffff');
                document.documentElement.style.setProperty('--text', '#000000');
                document.documentElement.style.setProperty('--text-shadow-strong', 'none');
                document.documentElement.style.setProperty('--text-shadow-weak', 'none');
            } else {
                document.documentElement.style.setProperty('--bg', '#000000');
                document.documentElement.style.setProperty('--text', '#ffffff');
                document.documentElement.style.setProperty('--text-shadow-strong', '0 2px 20px rgba(0,0,0,0.5), 0 0 60px rgba(108,92,255,0.08)');
                document.documentElement.style.setProperty('--text-shadow-weak', '0 2px 16px rgba(0,0,0,0.4)');
            }

            const scaleFactor = (state.fontSize || 13) / 13;

            // Song title in hover bar
            songTitleText.textContent = state.songTitle || '';

            // Determine which languages to show
            const lang = state.lang || 'en';
            const showEn = lang === 'en' || lang === 'en+kn' || lang === 'en+hi' || lang === 'all';
            const showKn = lang === 'kn' || lang === 'en+kn' || lang === 'all';
            const showHi = lang === 'hi' || lang === 'en+hi' || lang === 'all';

            // Build slide label
            if (state.slideLabel) {
                slideLabel.textContent = state.slideLabel;
                slideLabel.style.fontSize = `${42 * scaleFactor}px`;
                slideLabel.classList.remove('visible');
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        slideLabel.classList.add('visible');
                    });
                });
            } else {
                slideLabel.classList.remove('visible');
                slideLabel.textContent = '';
            }

            // Build lyrics HTML — all sizes in px for fixed canvas
            let html = '';
            let blockIndex = 0;

            let enSize = Math.round(64 * scaleFactor);
            if (state.isQuickPresenter) {
                enSize = Math.round(96 * scaleFactor);
            }
            const knHiSize = Math.round(56 * scaleFactor);

            if (showEn && state.en) {
                if (state.enIsHtml) {
                    html += `<div class="lyrics-block lyrics-en" style="font-size:${enSize}px; transition-delay:${blockIndex * 0.08}s">${state.en}</div>`;
                } else {
                    html += `<div class="lyrics-block lyrics-en" style="font-size:${enSize}px; transition-delay:${blockIndex * 0.08}s">${nl2br(state.en)}</div>`;
                }
                blockIndex++;
            }

            if (showEn && showKn && state.en && state.kn) {
                html += `<div class="lyrics-divider" style="transition-delay:${blockIndex * 0.08}s"></div>`;
            }

            if (showKn && state.kn) {
                html += `<div class="lyrics-block lyrics-kn" style="font-size:${knHiSize}px; transition-delay:${blockIndex * 0.08}s">${nl2br(state.kn)}</div>`;
                blockIndex++;
            }

            if ((showEn || showKn) && showHi && state.hi && (state.en || state.kn)) {
                html += `<div class="lyrics-divider" style="transition-delay:${blockIndex * 0.08}s"></div>`;
            }

            if (showHi && state.hi) {
                html += `<div class="lyrics-block lyrics-hi" style="font-size:${knHiSize}px; transition-delay:${blockIndex * 0.08}s">${nl2br(state.hi)}</div>`;
                blockIndex++;
            }

            // Fade out existing, then replace
            const existingBlocks = lyricsContent.querySelectorAll('.lyrics-block');
            existingBlocks.forEach(b => b.classList.remove('visible'));

            // Apply alignment from control panel
            lyricsContent.style.textAlign = state.align || 'center';

            setTimeout(() => {
                lyricsContent.innerHTML = html;

                requestAnimationFrame(() => {
                    // Auto-shrink if content overflows the 1080px canvas
                    const container = document.getElementById('presenterContainer');
                    const maxH = CANVAS_H - 120; // 60px padding top + bottom
                    const contentH = slideLabel.offsetHeight + lyricsContent.offsetHeight;

                    if (contentH > maxH && maxH > 0) {
                        const shrinkRatio = maxH / contentH;
                        // Scale down all text proportionally
                        lyricsContent.querySelectorAll('.lyrics-block').forEach(b => {
                            const currentFontSize = parseFloat(b.style.fontSize);
                            b.style.fontSize = Math.round(currentFontSize * shrinkRatio) + 'px';
                        });
                        if (state.slideLabel) {
                            const labelSize = parseFloat(slideLabel.style.fontSize);
                            slideLabel.style.fontSize = Math.round(labelSize * shrinkRatio) + 'px';
                        }
                    }

                    requestAnimationFrame(() => {
                        const newBlocks = lyricsContent.querySelectorAll('.lyrics-block');
                        newBlocks.forEach(b => b.classList.add('visible'));
                    });
                });
            }, existingBlocks.length ? 350 : 0);
        }

        /* ── Read state from localStorage ── */
        function readState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch (e) {
                console.warn('Failed to parse song presenter state:', e);
                return null;
            }
        }

        /* ── Listen for storage changes ── */
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY || e.key === null) {
                renderPresenter(readState());
            }
        });

        // Also poll periodically for same-tab changes
        let lastStateJSON = '';
        setInterval(() => {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw !== lastStateJSON) {
                lastStateJSON = raw;
                renderPresenter(readState());
            }
        }, 300);

        /* ── Keyboard shortcuts ── */
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            if (key === 'f') {
                e.preventDefault();
                toggleFullscreen();
            } else if (key === 'b') {
                e.preventDefault();
                toggleBlank();
            } else if (key === 'arrowright' || key === ' ') {
                e.preventDefault();
                // Dispatch next slide event to control page
                localStorage.setItem('song_presenter_nav', JSON.stringify({ action: 'next', ts: Date.now() }));
            } else if (key === 'arrowleft') {
                e.preventDefault();
                localStorage.setItem('song_presenter_nav', JSON.stringify({ action: 'prev', ts: Date.now() }));
            } else if (key === 'escape') {
                if (isBlank) {
                    toggleBlank();
                }
            }
        });

        btnPrev.addEventListener('click', () => {
            localStorage.setItem('song_presenter_nav', JSON.stringify({ action: 'prev', ts: Date.now() }));
        });

        btnNext.addEventListener('click', () => {
            localStorage.setItem('song_presenter_nav', JSON.stringify({ action: 'next', ts: Date.now() }));
        });

        btnBlank.addEventListener('click', toggleBlank);
        btnFullscreen.addEventListener('click', toggleFullscreen);

        /* ── Initial render ── */
        renderPresenter(readState());
        lastStateJSON = localStorage.getItem(STORAGE_KEY);
    </script>

    <!-- DroidCam Camera Overlay (MUST be before the camera script) -->
    <div class="droidcam-overlay circle" id="droidcamOverlay" style="display:none; width:150px; height:150px; bottom:40px; right:40px;">
      <video id="droidcamVideo" autoplay muted playsinline></video>
      <div class="droidcam-resize-handle" id="droidcamResize"></div>
    </div>

    <script>
    // DroidCam Overlay Logic
    const overlay = document.getElementById('droidcamOverlay');
    const video = document.getElementById('droidcamVideo');
    const resizeHandle = document.getElementById('droidcamResize');
    
    let camShape = 'circle';
    let camWidth = 150;
    let camHeight = 150;
    
    let isDragging = false;
    let isResizing = false;
    let dragStartX, dragStartY;
    let overlayStartX, overlayStartY;
    let startW, startH;

    function applySavedShapeAndSize() {
      const savedShape = localStorage.getItem('droidcam_shape');
      if (savedShape) {
        try {
          const s = JSON.parse(savedShape);
          camShape = s.shape || 'circle';
          camWidth = parseInt(s.w) || 150;
          camHeight = parseInt(s.h) || 150;
        } catch(e) { console.warn('Failed to parse droidcam_shape:', e); }
      }

      overlay.classList.remove('circle', 'square', 'rect', 'full');
      overlay.classList.add(camShape);
      
      if (camShape === 'full') {
        overlay.style.width = '100vw';
        overlay.style.height = '100vh';
        overlay.style.left = '0px';
        overlay.style.top = '0px';
        overlay.style.right = 'auto';
        overlay.style.bottom = 'auto';
      } else {
        overlay.style.width = camWidth + 'px';
        overlay.style.height = camHeight + 'px';
        applySavedPosition();
      }
    }

    function applySavedPosition() {
      if (camShape === 'full') return;
      const savedPos = localStorage.getItem('droidcam_position');
      if (savedPos) {
        try {
          const pos = JSON.parse(savedPos);
          if (pos.leftPct !== undefined && pos.topPct !== undefined) {
            const bodyW = document.body.clientWidth;
            const bodyH = document.body.clientHeight;
            overlay.style.left = (pos.leftPct / 100 * bodyW) + 'px';
            overlay.style.top = (pos.topPct / 100 * bodyH) + 'px';
            overlay.style.right = 'auto';
            overlay.style.bottom = 'auto';
          }
        } catch(e) { console.warn('Failed to parse droidcam_position:', e); }
      }
    }

    function checkCameraStatus() {
      const statusStr = localStorage.getItem('droidcam_status');
      if (statusStr) {
        try {
          const status = JSON.parse(statusStr);
          if (status.active && window.opener && window.opener.camStream) {
            video.srcObject = window.opener.camStream;
            overlay.style.display = 'block';
            applySavedShapeAndSize();
          } else {
            video.srcObject = null;
            overlay.style.display = 'none';
          }
        } catch(e) { console.warn('Failed to parse droidcam_status:', e); }
      } else {
          video.srcObject = null;
          overlay.style.display = 'none';
      }
    }

    checkCameraStatus();

    window.addEventListener('storage', (e) => {
      if (e.key === 'droidcam_status') {
        checkCameraStatus();
      }
      if (e.key === 'droidcam_shape') {
        applySavedShapeAndSize();
      }
      if (e.key === 'droidcam_position') {
        applySavedPosition();
      }
    });

    overlay.addEventListener('mousedown', (e) => {
      if (e.target === resizeHandle || e.target.closest('.droidcam-resize-handle')) return;
      if (camShape === 'full') return;
      isDragging = true;
      document.body.style.cursor = 'grabbing';
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      overlayStartX = overlay.offsetLeft;
      overlayStartY = overlay.offsetTop;
      e.stopPropagation();
    });

    resizeHandle.addEventListener('mousedown', (e) => {
      if (camShape === 'full') return;
      isResizing = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      startW = overlay.offsetWidth;
      startH = overlay.offsetHeight;
      e.stopPropagation();
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        overlay.style.left = (overlayStartX + dx) + 'px';
        overlay.style.top = (overlayStartY + dy) + 'px';
        overlay.style.right = 'auto';
        overlay.style.bottom = 'auto';
      }
      
      if (isResizing) {
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        
        if (camShape === 'circle') {
          const dMax = Math.max(dx, dy);
          let newDim = Math.max(80, startW + dMax);
          camWidth = newDim;
          camHeight = newDim;
          overlay.style.width = newDim + 'px';
          overlay.style.height = newDim + 'px';
        } else {
          camWidth = Math.max(80, startW + dx);
          camHeight = Math.max(80, startH + dy);
          overlay.style.width = camWidth + 'px';
          overlay.style.height = camHeight + 'px';
        }
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        document.body.style.cursor = '';
        
        const leftPct = (overlay.offsetLeft / document.body.clientWidth) * 100;
        const topPct = (overlay.offsetTop / document.body.clientHeight) * 100;
        localStorage.setItem('droidcam_position', JSON.stringify({
          leftPct: leftPct,
          topPct: topPct,
          timestamp: Date.now()
        }));
      }
      if (isResizing) {
        isResizing = false;
        localStorage.setItem('droidcam_shape', JSON.stringify({ w: camWidth, h: camHeight, shape: camShape }));
      }
    });
</script>
