<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Display — Bethel Full Gospel Church</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600&display=swap');

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000000;
            --text: #ffffff;
            --muted: rgba(255,255,255,0.4);
            --highlight: #ffd700;
            --transition-speed: 0.2s;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            cursor: none;
        }

        body.controls-visible {
            cursor: default;
        }

        .presenter-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .slide-label {
            font-family: 'Fraunces', serif;
            font-size: 2.5em;
            font-weight: 600;
            color: var(--highlight);
            margin-bottom: 0.4em;
            letter-spacing: 0.04em;
            text-transform: capitalize;
            opacity: 0;
            transition: opacity var(--transition-speed) ease;
        }

        .slide-label.visible {
            opacity: 1;
        }

        .lyrics-block {
            line-height: 1.4;
            max-width: 95%;
            margin: 0 auto;
            white-space: pre-wrap;
            word-break: break-word;
            opacity: 0;
            transition: opacity var(--transition-speed) ease;
        }

        .lyrics-block.visible {
            opacity: 1;
        }

        .lyrics-en {
            font-size: 4em;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.2em;
        }

        .lyrics-kn,
        .lyrics-hi {
            font-size: 3.5em;
            font-weight: 500;
            color: rgba(255,255,255,0.9);
            margin-bottom: 0.2em;
        }

        .lyrics-divider {
            width: 100px;
            height: 3px;
            background: var(--highlight);
            margin: 0.3em auto 0.4em;
            border-radius: 2px;
            opacity: 0.8;
        }

        .waiting-message {
            font-family: 'Fraunces', serif;
            font-size: 2.5em;
            color: var(--muted);
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .waiting-message.visible {
            opacity: 1;
        }

        .song-title-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 200;
            padding: 20px 32px;
            background: linear-gradient(rgba(0,0,0,0.8), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .song-title-bar.visible {
            opacity: 1;
        }

        .song-title-text {
            font-family: 'Fraunces', serif;
            font-size: 1.5em;
            font-weight: 700;
            color: var(--highlight);
        }

        .stage-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 215, 0, 0.2);
            color: var(--highlight);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2em;
            border: 1px solid rgba(255, 215, 0, 0.4);
            z-index: 10;
        }
    
/* DroidCam Overlay Styles for Presenter */
.droidcam-overlay {
  position: absolute;
  z-index: 10000;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  border: 3px solid rgba(255,255,255,0.2);
  transition: border-radius 0.3s ease;
  user-select: none;
}
.droidcam-overlay.circle {
  border-radius: 50%;
}
.droidcam-overlay.square {
  border-radius: 20px;
}
.droidcam-overlay.rect {
  border-radius: 12px;
}
.droidcam-overlay.full {
  border-radius: 0;
  border: none;
  width: 100% !important;
  height: 100% !important;
  top: 0 !important;
  left: 0 !important;
  bottom: auto !important;
  right: auto !important;
  box-shadow: none;
}
.droidcam-overlay.full .droidcam-resize-handle {
  display: none !important;
}
.droidcam-overlay:active {
  cursor: grabbing;
  border-color: rgba(255,255,255,0.5);
}
.droidcam-overlay video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}
.droidcam-resize-handle {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 30px;
  height: 30px;
  cursor: nwse-resize;
  z-index: 10001;
  background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.3) 50%);
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: auto;
}
.droidcam-overlay:hover .droidcam-resize-handle {
  opacity: 1;
}
.droidcam-resize-handle::after {
  content: '';
  position: absolute;
  bottom: 6px;
  right: 6px;
  width: 8px;
  height: 8px;
  border-right: 2px solid white;
  border-bottom: 2px solid white;
}
</style>
</head>
<body>
    <div class="stage-badge">STAGE DISPLAY</div>

    <div class="song-title-bar" id="songTitleBar">
        <div class="song-title-text" id="songTitleText"></div>
    </div>

    <div class="presenter-container" id="presenterContainer">
        <div class="slide-label" id="slideLabel"></div>
        <div id="lyricsContent"></div>
        <div class="waiting-message" id="waitingMessage">
            Waiting for song selection...
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'stage_display_state';
        const CONTROLS_TIMEOUT = 2000;

        const slideLabel = document.getElementById('slideLabel');
        const lyricsContent = document.getElementById('lyricsContent');
        const waitingMessage = document.getElementById('waitingMessage');
        const songTitleBar = document.getElementById('songTitleBar');
        const songTitleText = document.getElementById('songTitleText');

        let controlsTimer = null;

        function showControls() {
            songTitleBar.classList.add('visible');
            document.body.classList.add('controls-visible');
            clearTimeout(controlsTimer);
            controlsTimer = setTimeout(hideControls, CONTROLS_TIMEOUT);
        }

        function hideControls() {
            songTitleBar.classList.remove('visible');
            document.body.classList.remove('controls-visible');
        }

        document.addEventListener('mousemove', showControls);
        document.addEventListener('mousedown', showControls);

        function nl2br(str) {
            if (!str) return '';
            return str.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
        }

        function renderPresenter(state) {
            if (!state) {
                slideLabel.classList.remove('visible');
                slideLabel.textContent = '';
                const blocks = lyricsContent.querySelectorAll('.lyrics-block');
                blocks.forEach(b => b.classList.remove('visible'));
                setTimeout(() => {
                    lyricsContent.innerHTML = '';
                    waitingMessage.classList.add('visible');
                }, blocks.length ? 200 : 0);
                songTitleText.textContent = '';
                return;
            }

            waitingMessage.classList.remove('visible');

            const scaleFactor = (state.fontSize || 13) / 13;
            songTitleText.textContent = state.songTitle || '';

            const lang = state.lang || 'en';
            const showEn = lang === 'en' || lang === 'en+kn' || lang === 'en+hi' || lang === 'all';
            const showKn = lang === 'kn' || lang === 'en+kn' || lang === 'all';
            const showHi = lang === 'hi' || lang === 'en+hi' || lang === 'all';

            if (state.slideLabel) {
                slideLabel.textContent = state.slideLabel;
                slideLabel.style.fontSize = `${2.5 * scaleFactor}em`;
                slideLabel.classList.remove('visible');
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        slideLabel.classList.add('visible');
                    });
                });
            } else {
                slideLabel.classList.remove('visible');
                slideLabel.textContent = '';
            }

            let html = '';
            if (showEn && state.en) {
                if (state.enIsHtml) {
                    html += `<div class="lyrics-block lyrics-en" style="font-size:${4 * scaleFactor}em;">${state.en}</div>`;
                } else {
                    html += `<div class="lyrics-block lyrics-en" style="font-size:${4 * scaleFactor}em;">${nl2br(state.en)}</div>`;
                }
            }
            if (showEn && showKn && state.en && state.kn) {
                html += `<div class="lyrics-divider"></div>`;
            }
            if (showKn && state.kn) {
                html += `<div class="lyrics-block lyrics-kn" style="font-size:${3.5 * scaleFactor}em;">${nl2br(state.kn)}</div>`;
            }
            if ((showEn || showKn) && showHi && state.hi && (state.en || state.kn)) {
                html += `<div class="lyrics-divider"></div>`;
            }
            if (showHi && state.hi) {
                html += `<div class="lyrics-block lyrics-hi" style="font-size:${3.5 * scaleFactor}em;">${nl2br(state.hi)}</div>`;
            }

            const existingBlocks = lyricsContent.querySelectorAll('.lyrics-block');
            existingBlocks.forEach(b => b.classList.remove('visible'));
            lyricsContent.style.textAlign = state.align || 'center';

            setTimeout(() => {
                lyricsContent.style.fontSize = '1em';
                if (state.slideLabel) {
                    slideLabel.style.fontSize = `${2.5 * scaleFactor}em`;
                }
                lyricsContent.innerHTML = html;

                requestAnimationFrame(() => {
                    const container = document.getElementById('presenterContainer');
                    const maxH = container.clientHeight - 80; // accounting for 40px padding top/bottom
                    const contentH = slideLabel.offsetHeight + lyricsContent.offsetHeight;

                    if (contentH > maxH && maxH > 0) {
                        const shrinkRatio = maxH / contentH;
                        lyricsContent.style.fontSize = shrinkRatio + 'em';
                        if (state.slideLabel) {
                            slideLabel.style.fontSize = `${2.5 * scaleFactor * shrinkRatio}em`;
                        }
                    }

                    requestAnimationFrame(() => {
                        const newBlocks = lyricsContent.querySelectorAll('.lyrics-block');
                        newBlocks.forEach(b => b.classList.add('visible'));
                    });
                });
            }, existingBlocks.length ? 200 : 0);
        }

        function readState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch (e) {
                console.warn('Failed to parse stage display state:', e);
                return null;
            }
        }

        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY || e.key === null) {
                renderPresenter(readState());
            }
        });



        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f') {
                e.preventDefault();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(e => console.warn('Fullscreen request failed:', e));
                } else {
                    document.exitFullscreen();
                }
            }
        });

        renderPresenter(readState());
        lastStateJSON = localStorage.getItem(STORAGE_KEY);
    </script>

    <!-- DroidCam Camera Overlay (MUST be before the camera script) -->
    <div class="droidcam-overlay circle" id="droidcamOverlay" style="display:none; width:150px; height:150px; bottom:40px; right:40px;">
      <video id="droidcamVideo" autoplay muted playsinline></video>
      <div class="droidcam-resize-handle" id="droidcamResize"></div>
    </div>

    <script>
    // ==========================================
    // DroidCam Overlay Logic
    // ==========================================
    const overlay = document.getElementById('droidcamOverlay');
    const video = document.getElementById('droidcamVideo');
    const resizeHandle = document.getElementById('droidcamResize');
    
    let camShape = 'circle';
    let camWidth = 150;
    let camHeight = 150;
    
    let isDragging = false;
    let isResizing = false;
    let dragStartX, dragStartY;
    let overlayStartX, overlayStartY;
    let startW, startH;

    function applySavedShapeAndSize() {
      const savedShape = localStorage.getItem('droidcam_shape');
      if (savedShape) {
        try {
          const s = JSON.parse(savedShape);
          camShape = s.shape || 'circle';
          camWidth = parseInt(s.w) || 150;
          camHeight = parseInt(s.h) || 150;
        } catch(e) { console.warn('Failed to parse droidcam_shape:', e); }
      }

      overlay.classList.remove('circle', 'square', 'rect', 'full');
      overlay.classList.add(camShape);
      
      if (camShape === 'full') {
        overlay.style.width = '100vw';
        overlay.style.height = '100vh';
        overlay.style.left = '0px';
        overlay.style.top = '0px';
        overlay.style.right = 'auto';
        overlay.style.bottom = 'auto';
      } else {
        overlay.style.width = camWidth + 'px';
        overlay.style.height = camHeight + 'px';
        applySavedPosition();
      }
    }

    function applySavedPosition() {
      if (camShape === 'full') return;
      const savedPos = localStorage.getItem('droidcam_position');
      if (savedPos) {
        try {
          const pos = JSON.parse(savedPos);
          if (pos.leftPct !== undefined && pos.topPct !== undefined) {
            const bodyW = document.body.clientWidth;
            const bodyH = document.body.clientHeight;
            overlay.style.left = (pos.leftPct / 100 * bodyW) + 'px';
            overlay.style.top = (pos.topPct / 100 * bodyH) + 'px';
            overlay.style.right = 'auto';
            overlay.style.bottom = 'auto';
          }
        } catch(e) { console.warn('Failed to parse droidcam_position:', e); }
      }
    }

    function checkCameraStatus() {
      const statusStr = localStorage.getItem('droidcam_status');
      if (statusStr) {
        try {
          const status = JSON.parse(statusStr);
          if (status.active && window.opener && window.opener.camStream) {
            video.srcObject = window.opener.camStream;
            overlay.style.display = 'block';
            applySavedShapeAndSize();
          } else {
            video.srcObject = null;
            overlay.style.display = 'none';
          }
        } catch(e) { console.warn('Failed to parse droidcam_status:', e); }
      } else {
          video.srcObject = null;
          overlay.style.display = 'none';
      }
    }

    checkCameraStatus();

    window.addEventListener('storage', (e) => {
      if (e.key === 'droidcam_status') {
        checkCameraStatus();
      }
      if (e.key === 'droidcam_shape') {
        applySavedShapeAndSize();
      }
      if (e.key === 'droidcam_position') {
        applySavedPosition();
      }
    });

    overlay.addEventListener('mousedown', (e) => {
      if (e.target === resizeHandle || e.target.closest('.droidcam-resize-handle')) return;
      if (camShape === 'full') return;
      isDragging = true;
      document.body.style.cursor = 'grabbing';
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      overlayStartX = overlay.offsetLeft;
      overlayStartY = overlay.offsetTop;
      e.stopPropagation();
    });

    resizeHandle.addEventListener('mousedown', (e) => {
      if (camShape === 'full') return;
      isResizing = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      startW = overlay.offsetWidth;
      startH = overlay.offsetHeight;
      e.stopPropagation();
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        overlay.style.left = (overlayStartX + dx) + 'px';
        overlay.style.top = (overlayStartY + dy) + 'px';
        overlay.style.right = 'auto';
        overlay.style.bottom = 'auto';
      }
      
      if (isResizing) {
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        
        if (camShape === 'circle') {
          const dMax = Math.max(dx, dy);
          let newDim = Math.max(80, startW + dMax);
          camWidth = newDim;
          camHeight = newDim;
          overlay.style.width = camWidth + 'px';
          overlay.style.height = camHeight + 'px';
        } else {
          camWidth = Math.max(80, startW + dx);
          camHeight = Math.max(80, startH + dy);
          overlay.style.width = camWidth + 'px';
          overlay.style.height = camHeight + 'px';
        }
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        document.body.style.cursor = '';
        
        const leftPct = (overlay.offsetLeft / document.body.clientWidth) * 100;
        const topPct = (overlay.offsetTop / document.body.clientHeight) * 100;
        localStorage.setItem('droidcam_position', JSON.stringify({
          leftPct: leftPct,
          topPct: topPct,
          timestamp: Date.now()
        }));
      }
      if (isResizing) {
        isResizing = false;
        localStorage.setItem('droidcam_shape', JSON.stringify({ w: camWidth, h: camHeight, shape: camShape }));
      }
    });
</script>
</body>
</html>
